<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141b19">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Карточки English</title>
<style>
/* всегда темная тема, независимо от настроек телефона */
:root{--bg:#141b19;--card:#1f2926;--fg:#e6eeeb;--muted:#9aaba5;--accent:#7cc4ae;--no:#e38a72;--line:#33423d;
--display:Georgia,"Times New Roman",serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
main{overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font:16px var(--body);
padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
#listBtn{display:flex;align-items:center;gap:6px;min-width:0;padding:8px 12px;font:700 1.15rem var(--display);border-color:var(--line)}
#listName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#listBtn .arr{font:600 .8rem var(--body);color:var(--muted)}
#picker{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;
padding:max(64px,env(safe-area-inset-top)) 16px 16px;z-index:10}
#pickerBox{background:var(--card);border-radius:16px;width:100%;max-width:448px;max-height:75vh;overflow:auto;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#pickerBox h2{font:600 .8rem var(--body);color:var(--muted);margin:8px 10px 6px;text-transform:uppercase;letter-spacing:.04em}
.pick{display:flex;justify-content:space-between;align-items:center;width:100%;gap:12px;text-align:left;border:0;border-radius:10px;padding:13px 12px;background:transparent}
.pick.current{background:var(--bg);color:var(--accent)}
.pick .cnt{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;font-size:.9rem}
#counter{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.card{transition:transform .18s ease-out;will-change:transform;
flex:1;min-height:320px;background:var(--card);border:1px solid var(--line);border-radius:18px;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 20px;text-align:center}
/* стрелки по бокам слова - только на компьютере (мышь), на телефоне листают смахиванием */
.wordrow{display:flex;align-items:center;width:100%;gap:6px}
.nav{display:none;flex:none;width:44px;height:44px;padding:0;border-radius:50%;font:400 1.9rem/1 var(--body);
color:var(--muted);background:transparent;border:1px solid var(--line);align-items:center;justify-content:center}
.nav:hover:not(:disabled){color:var(--accent);border-color:var(--accent)}
.nav:disabled{opacity:.25;cursor:default}
@media (hover:hover) and (pointer:fine){.nav{display:flex}}
#face{cursor:pointer;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px;border-radius:12px;-webkit-tap-highlight-color:transparent;user-select:none}
#face:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#word{font:2rem/1.25 var(--display);max-width:100%;overflow-wrap:normal}
#word,#ipa,#read{width:100%}
#face[data-side="en"] #word{color:var(--accent);font-weight:700}
#hint{color:var(--muted);font-size:.85rem;white-space:pre-line;line-height:1.5}
/* место под кнопку/транскрипцию всегда зарезервировано, поэтому слово не сдвигается */
#slot{height:112px;display:flex;align-items:flex-start;justify-content:center}
#ipaBox{display:flex;flex-direction:column;gap:6px}
#ipa{color:var(--muted);font-size:1.15rem}
#read{font-size:1.2rem}
.seg{display:inline-block;white-space:nowrap}
button{font:600 1rem var(--body);padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button:disabled{opacity:.4;cursor:default}
#ipaBtn,#other{padding:10px 18px;border-color:var(--accent);color:var(--accent);background:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#know{background:var(--accent);border-color:var(--accent);color:var(--card)}
#dontknow{color:var(--no);border-color:var(--no)}
#restart{background:transparent}
#mode{margin:-6px 0 -4px;text-align:center;color:var(--accent);font-size:.75rem;line-height:1.4;height:1.4em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#status{margin:0;text-align:center;color:var(--muted);font-size:.75rem;line-height:1.4;height:1.4em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card.dragging{transition:none}
@media (prefers-reduced-motion:reduce){.card{transition:none}.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <button id="listBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="picker"><span id="listName"></span><span class="arr" aria-hidden="true">▼</span></button>
    <span id="counter">1 / 1</span>
  </header>
  <div class="bar"><i id="fill"></i></div>
  <div id="mode" aria-live="polite"></div>
  <section class="card">
    <div class="wordrow">
      <button id="prev" class="nav" type="button" aria-label="Предыдущая карточка" title="Предыдущая карточка (←)">‹</button>
      <div id="face" role="button" tabindex="0" aria-live="polite" data-side="ru">
        <div id="word"></div>
        <div id="hint"></div>
      </div>
      <button id="next" class="nav" type="button" aria-label="Следующая карточка" title="Следующая карточка (→)">›</button>
    </div>
    <div id="slot">
      <button id="ipaBtn" type="button" hidden aria-controls="ipaBox" aria-expanded="false">Транскрипция</button>
      <div id="ipaBox" hidden><div id="ipa"></div><div id="read"></div></div>
      <button id="other" type="button" hidden>Другой список</button>
    </div>
  </section>
  <p id="status" aria-live="polite"></p>
</main>
<div id="picker" hidden role="dialog" aria-modal="true" aria-label="Выбор списка">
  <div id="pickerBox"><h2>Список слов</h2><div id="pickerList"></div></div>
</div>
<script>
// Интервальное повторение (упрощенная схема Лейтнера / SM-2).
//
// Оценка ставится одним жестом - смахиванием:
//   смахнул, НЕ переворачивая  -> помню;
//   перевернул хотя бы раз     -> не помню.
//
// Долгая память (между днями): у слова есть уровень lvl и дата следующего показа due.
//   новое слово, сразу вспомнил        -> lvl 2, снова через 3 дня (уже знал его);
//   вспомнил при повторении             -> lvl + 1, интервал растет: 1, 3, 7, 16, 35, 80, 180 дней;
//   не вспомнил                         -> lvl 0 и доучивание прямо сейчас (см. ниже),
//                                          после доучивания - снова завтра.
// Короткая память (в течение занятия): забытое слово возвращается через 3 карточки,
//   потом, если вспомнил, через 7 и через 15 - растущие промежутки закрепляют лучше,
//   чем повтор подряд. Забыл на любом шаге - шаги начинаются сначала.
// Когда слова по расписанию на сегодня кончились, занятие не обрывается: идет тренировка
//   (practice) - сначала самые трудные слова. Раньше срока расписание она не сдвигает,
//   а забытое в ней слово уходит на доучивание, как обычно.

const DAY = 24 * 60 * 60 * 1000;
const INTERVALS = [0, 1, 3, 7, 16, 35, 80, 180]; // дней для lvl 1..7
const MAX_LVL = INTERVALS.length - 1;
const STEPS = [3, 7, 15]; // через сколько карточек показать забытое слово снова (закрепляем трижды)

function keyOf(card) {
  return card.en.trim().toLowerCase() + '|' + card.ru.trim().toLowerCase();
}

function hasIpa(card) {
  return Boolean((card.ipa && card.ipa.trim()) || (card.read && card.read.trim()));
}

function dayOf(now) {
  const d = new Date(now);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// Повторения, которые надо сделать сегодня: к концу дня, а не к текущей минуте.
function endOfDay(now) {
  const d = new Date(now);
  d.setHours(23, 59, 59, 999);
  return d.getTime();
}

function shuffle(arr, rng = Math.random) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function uniqueKeys(cards) {
  return [...new Set(cards.map(keyOf))];
}

const isDue = (p, now) => Boolean(p) && p.due <= endOfDay(now);
// Слово сегодня уже отвечено и до следующего повторения не нужно.
const answeredToday = (p, now) => Boolean(p) && Boolean(p.last) && dayOf(p.last) === dayOf(now) && !isDue(p, now);

// Насколько слово трудное: чем меньше уровень, чем чаще забывали и чем ближе срок -
// тем раньше оно в тренировке. Новые слова (без истории) - как самые трудные.
function difficultyOrder(keys, progress, now, rng = Math.random) {
  const score = (k) => {
    const p = progress[k];
    if (!p) return -1e9;
    return p.lvl * 100 - (p.lapses || 0) * 40 + Math.max(0, (p.due - now) / DAY);
  };
  return shuffle(keys, rng).sort((a, b) => score(a) - score(b)); // shuffle - случайный порядок среди равных
}

// Занятие на сегодня: сначала слова, срок которых подошел (самые просроченные первыми),
// потом новые в случайном порядке. В режиме practice - все слова списка, трудные первыми;
// avoid - слово, которое только что было, чтобы оно не шло два раза подряд.
function buildSession(cards, progress, now, rng = Math.random, practice = false, avoid = null) {
  const keys = uniqueKeys(cards);
  let queue;
  if (practice) {
    queue = difficultyOrder(keys, progress, now, rng);
    if (queue.length > 1 && queue[0] === avoid) [queue[0], queue[1]] = [queue[1], queue[0]];
  } else {
    const due = keys.filter((k) => isDue(progress[k], now)).sort((a, b) => progress[a].due - progress[b].due);
    const fresh = shuffle(keys.filter((k) => !progress[k]), rng);
    queue = [...due, ...fresh];
  }
  // Слова этого списка, которые сегодня уже отвечены (здесь или в другом списке), сразу
  // считаем пройденными: счетчик показывает весь сегодняшний объем, а не только остаток.
  const doneToday = practice ? 0 : keys.filter((k) => answeredToday(progress[k], now)).length;
  return withTotal({ day: dayOf(now), practice, queue, steps: {}, total: 0, done: doneToday, flipped: false, ipaShown: false, revealed: false });
}

// Счетчик занятия считает каждое смахивание: done - сколько карточек уже пролистано,
// total - done плюс все, что еще предстоит: карточки в очереди и будущие повторы
// забытых слов (у слова на шаге i осталось еще STEPS.length - 1 - i возвратов).
// Забыл слово - total вырастает на число шагов доучивания, но первое число не стоит на месте.
function withTotal(s) {
  let extra = 0;
  for (const k of Object.keys(s.steps)) if (s.queue.includes(k)) extra += STEPS.length - 1 - s.steps[k];
  return { ...s, total: s.done + s.queue.length + extra };
}

const current = (s) => (s.queue.length ? s.queue[0] : null);
const isFinished = (s) => s.queue.length === 0;

function flip(s) {
  if (isFinished(s)) return s;
  const flipped = !s.flipped;
  // увидел ответ - значит, не вспомнил сам
  return { ...s, flipped, ipaShown: false, revealed: s.revealed || flipped };
}

function toggleIpa(s) {
  if (isFinished(s) || !s.flipped) return s;
  return { ...s, ipaShown: !s.ipaShown };
}

// Смахивание. Возвращает новое занятие и новый прогресс.
function swipe(s, progress, now) {
  if (isFinished(s)) return { s, progress };
  const [key, ...rest] = s.queue;
  const remembered = !s.revealed;
  const p = progress[key];
  const steps = { ...s.steps };
  const next = { ...progress };
  const base = { flipped: false, ipaShown: false, revealed: false };

  const finish = (rec) => {
    if (rec) next[key] = { ...rec, last: now };
    delete steps[key];
    return { s: withTotal({ ...s, ...base, queue: rest, steps, done: s.done + 1 }), progress: next };
  };
  const requeue = (stepIdx) => {
    steps[key] = stepIdx;
    const q = rest.slice();
    q.splice(Math.min(q.length, STEPS[stepIdx]), 0, key);
    return { s: withTotal({ ...s, ...base, queue: q, steps, done: s.done + 1 }), progress: next };
  };

  if (!remembered) {
    // не вспомнил: сброс уровня и доучивание с первого шага
    const lapse = p && !(key in steps) ? 1 : 0; // повторный провал на шаге доучивания - не новый провал
    next[key] = { lvl: 0, due: now, lapses: ((p && p.lapses) || 0) + lapse, last: now };
    return requeue(0);
  }

  if (key in steps) {
    // вспомнил на шаге доучивания
    if (steps[key] + 1 < STEPS.length) return requeue(steps[key] + 1);
    return finish({ ...next[key], lvl: 1, due: now + INTERVALS[1] * DAY });
  }

  if (!p) return finish({ lvl: 2, due: now + INTERVALS[2] * DAY, lapses: 0 }); // новое, но уже знал
  if (s.practice && !isDue(p, now)) return finish(null); // тренировка раньше срока: расписание не трогаем
  const lvl = Math.min(MAX_LVL, p.lvl + 1);
  return finish({ ...p, lvl, due: now + INTERVALS[lvl] * DAY });
}

// Подстраивает занятие под новый список слов: удаленные убираем, новые добавляем в конец.
// Если передан now: слова, на которые сегодня уже ответили в другом списке, из очереди
// убираются и засчитываются как пройденные (иначе они показались бы второй раз).
function merge(s, cards, progress, now) {
  const keys = uniqueKeys(cards);
  const has = new Set(keys);
  const kept = s.queue.filter((k) => has.has(k));
  const removed = s.queue.length - kept.length;
  const handled = now === undefined || s.practice ? [] : kept.filter((k) => !(k in s.steps) && answeredToday(progress[k], now));
  const queue = kept.filter((k) => !handled.includes(k));
  const added = s.practice ? [] : keys.filter((k) => !progress[k] && !queue.includes(k));
  const steps = {};
  for (const k of Object.keys(s.steps)) if (has.has(k)) steps[k] = s.steps[k];
  const sameFront = queue[0] === s.queue[0];
  return withTotal({
    ...s,
    queue: [...queue, ...added],
    steps,
    done: s.done + handled.length,
    flipped: sameFront && s.flipped,
    ipaShown: sameFront && s.ipaShown,
    revealed: sameFront && s.revealed,
  });
}

// Нужно ли собрать занятие заново (наступил новый день, а занятие закончено или вчерашнее).
function isStale(s, now) {
  return !s || s.day !== dayOf(now);
}

// Сколько слов списка еще ждут сегодня (по расписанию или новые).
function remainingToday(cards, progress, now) {
  return uniqueKeys(cards).filter((k) => !progress[k] || isDue(progress[k], now)).length;
}

function hasNew(cards, progress) {
  return uniqueKeys(cards).some((k) => !progress[k]);
}

function learnedCount(cards, progress) {
  return uniqueKeys(cards).filter((k) => progress[k] && progress[k].lvl >= 1).length;
}

function dueCount(cards, progress, now) {
  return uniqueKeys(cards).filter((k) => !progress[k] || isDue(progress[k], now)).length;
}

// Когда следующее повторение (для экрана "на сегодня все"). null - слов нет.
function nextDue(cards, progress) {
  let best = null;
  for (const k of uniqueKeys(cards)) {
    const p = progress[k];
    if (!p) return 0; // есть новые - можно хоть сейчас
    if (best === null || p.due < best) best = p.due;
  }
  return best;
}

function serialize(s) {
  const { day, practice, queue, steps, total, done } = s;
  return JSON.stringify({ v: 4, day, practice, queue, steps, total, done });
}

function restore(raw) {
  try {
    const o = JSON.parse(raw);
    if (!o || o.v !== 4 || !Array.isArray(o.queue) || typeof o.day !== 'string') return null;
    if (!o.queue.every((k) => typeof k === 'string') || new Set(o.queue).size !== o.queue.length) return null;
    const steps = o.steps && typeof o.steps === 'object' ? o.steps : {};
    return withTotal({ day: o.day, practice: !!o.practice, queue: o.queue, steps, total: 0, done: o.done | 0, flipped: false, ipaShown: false, revealed: false });
  } catch {
    return null;
  }
}

function restoreProgress(raw) {
  try {
    const o = JSON.parse(raw);
    if (!o || typeof o !== 'object') return {};
    const out = {};
    for (const [k, p] of Object.entries(o)) {
      if (p && Number.isFinite(p.due) && Number.isInteger(p.lvl)) {
        out[k] = { lvl: p.lvl, due: p.due, lapses: p.lapses | 0 };
        if (Number.isFinite(p.last)) out[k].last = p.last;
      }
    }
    return out;
  } catch {
    return {};
  }
}

const Srs = {
  DAY, INTERVALS, STEPS, keyOf, difficultyOrder, remainingToday, hasNew, hasIpa, dayOf, shuffle, buildSession, current, isFinished, flip, toggleIpa,
  swipe, merge, isStale, learnedCount, dueCount, nextDue, serialize, restore, restoreProgress,
};


// Чтение слов из Google-таблицы (CSV).
// Столбцы: Русский | Английский | Транскрипция | Чтение | Список. Первая строка - заголовок.
// В "Список" можно несколько названий через запятую; пусто - слово только во "Все слова".

const SHEET_ID = '17X-eUQzulBYLosELbQ4PD_6HL-trYI9AO11DLDUcr50';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&headers=1';

// CSV по RFC 4180: кавычки, запятые и переносы строк внутри кавычек.
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQ = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false;
      } else field += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += ch;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function rowsToCards(rows) {
  const out = [];
  rows.forEach((r, i) => {
    const [ru = '', en = '', ipa = '', read = '', list = ''] = r.map((x) => (x || '').trim());
    if (i === 0 && /^русск/i.test(ru)) return; // заголовок
    if (!ru || !en) return; // пустые и недописанные строки пропускаем
    const lists = [...new Set(list.split(',').map((x) => x.trim()).filter(Boolean))];
    out.push({ ru, en, ipa, read, lists });
  });
  return out;
}

async function fetchCards(fetchFn = fetch, url = SHEET_URL) {
  const res = await fetchFn(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  if (/^\s*</.test(text)) throw new Error('таблица закрыта (нет доступа по ссылке)');
  const cards = rowsToCards(parseCSV(text));
  if (!cards.length) throw new Error('в таблице нет слов');
  return cards;
}

const Sheet = { SHEET_ID, SHEET_URL, parseCSV, rowsToCards, fetchCards };


// Списки слов: "Все слова", списки из столбца "Список", "Без списка".
const ALL = '__all__';
const NONE = '__none__';

function listNames(cards) {
  const names = [];
  for (const c of cards) for (const l of c.lists || []) if (!names.includes(l)) names.push(l);
  return names;
}

function hasUnlisted(cards) {
  return cards.some((c) => !c.lists || !c.lists.length);
}

// Пункты меню в порядке показа: все, списки по порядку появления, без списка.
function menuItems(cards) {
  const items = [ALL, ...listNames(cards)];
  if (hasUnlisted(cards) && items.length > 1) items.push(NONE);
  return items;
}

function cardsFor(cards, name) {
  if (name === ALL) return cards;
  if (name === NONE) return cards.filter((c) => !c.lists || !c.lists.length);
  return cards.filter((c) => (c.lists || []).includes(name));
}

function label(name) {
  return name === ALL ? 'Все слова' : name === NONE ? 'Без списка' : name;
}

const Lists = { ALL, NONE, listNames, menuItems, cardsFor, label };


// Слова из колоды "Мои слова NNN". Без карточки-правила про -y -> -ily.
const CARDS = [
  { ru: "работать усердно", en: "work hard", ipa: "/wɜːk hɑːd/", read: "«уёк ХАД»" },
  { ru: "сегодня вечером", en: "this evening / tonight", ipa: "/ðɪs ˈiːvnɪŋ/, /təˈnaɪt/", read: "«зис ИВнин», «тэНАЙТ»" },
  { ru: "идёт дождь", en: "it rains / it's raining", ipa: "", read: "" },
  { ru: "когда-либо", en: "ever", ipa: "/ˈevə/", read: "«Эвэ»" },
  { ru: "тихо", en: "quietly", ipa: "/ˈkwaɪətli/", read: "«КВАЙэтли»" },
  { ru: "невероятно", en: "incredibly", ipa: "/ɪnˈkredəbli/", read: "«инКРЭдэбли»" },
  { ru: "полезно, здорово (о еде)", en: "healthily", ipa: "/ˈhelθɪli/", read: "«ХЭЛсили»" },
  { ru: "идеально", en: "perfectly", ipa: "/ˈpɜːfɪktli/", read: "«ПЁфиктли»" },
  { ru: "бегло", en: "fluently", ipa: "/ˈfluːəntli/", read: "«ФЛУэнтли»" },
  { ru: "спокойно", en: "calmly", ipa: "/ˈkɑːmli/", read: "«КАМли» (l не читается)" },
  { ru: "терпеливый / терпеливо", en: "patient / patiently", ipa: "/ˈpeɪʃnt/, /ˈpeɪʃntli/", read: "«ПЕЙшнт», «ПЕЙшнтли»" },
  { ru: "очередь", en: "queue", ipa: "/kjuː/", read: "«кью»" },
  { ru: "вести себя", en: "behave", ipa: "/bɪˈheɪv/", read: "«биХЕЙВ»" },
  { ru: "кризис", en: "crisis", ipa: "/ˈkraɪsɪs/", read: "«КРАЙсис»" },
  { ru: "относиться к, обращаться с", en: "treat", ipa: "/triːt/", read: "«трит» (без предлога)" },
  { ru: "наступать", en: "tread", ipa: "/tred/", read: "«трэд»" },
  { ru: "в начале месяца", en: "at the beginning of the month", ipa: "/bɪˈɡɪnɪŋ/", read: "«биГИнин»" },
  { ru: "в конце месяца", en: "at the end of the month", ipa: "", read: "" },
  { ru: "огромный", en: "huge", ipa: "/hjuːdʒ/", read: "«хьюдж»" },
  { ru: "порция", en: "portion", ipa: "/ˈpɔːʃn/", read: "«ПОшн»" },
  { ru: "следующие 40 лет", en: "for the next 40 years", ipa: "", read: "" },
  { ru: "ездить верхом", en: "ride", ipa: "/raɪd/", read: "«райд»" },
  { ru: "научиться что-то делать", en: "learn to do", ipa: "/lɜːn tə duː/", read: "«лён тэ ду»" },
  { ru: "кто-нибудь; никто (в отрицании)", en: "anyone", ipa: "/ˈeniwʌn/", read: "«Эниуан»" },
].map((c) => ({ ...c, lists: ["Первый список"] }));


// Интерфейс. Ожидает глобальные Srs, Sheet, Lists и CARDS (встроенные слова на случай без сети).
(function () {
  const PROGRESS_KEY = 'nnn-srs-progress-v1';  // память по каждому слову: уровень и дата повторения
  const SESSIONS_KEY = 'nnn-srs-sessions-v1';  // выбранный список и сегодняшнее занятие по каждому списку
  const WORDS_KEY = 'nnn-words-v2';            // последние слова из таблицы
  const $ = (id) => document.getElementById(id);
  const now = () => Date.now();

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  function loadCachedWords() {
    try {
      const w = JSON.parse(store.get(WORDS_KEY));
      if (Array.isArray(w) && w.length && w.every((c) => c && c.ru && c.en && Array.isArray(c.lists))) return w;
    } catch {}
    return null;
  }

  // --- данные ---
  let cards = [];
  let byKey = new Map();
  function setCards(list) {
    cards = list;
    byKey = new Map(list.map((c) => [Srs.keyOf(c), c]));
  }
  setCards(loadCachedWords() || CARDS);

  let progress = Srs.restoreProgress(store.get(PROGRESS_KEY));
  let saved = {};
  try { saved = JSON.parse(store.get(SESSIONS_KEY)) || {}; } catch {}
  const sessions = saved.sessions && typeof saved.sessions === 'object' ? saved.sessions : {};
  // preferred - список, выбранный пользователем; listName - открытый сейчас.
  // Они расходятся, пока выбранного списка нет в словах (например, до загрузки таблицы).
  let preferred = typeof saved.current === 'string' ? saved.current : Lists.ALL;
  let listName = preferred;

  let state;
  const UNDO_MAX = 20;
  let history = []; // для возврата смахнутых карточек: [{ state, key, had, rec }]
  function openList(name, practice = false) {
    history = []; // возврат работает только в пределах одного занятия
    if (!Lists.menuItems(cards).includes(name)) name = Lists.ALL;
    listName = name;
    const subset = Lists.cardsFor(cards, name);
    const prev = !practice && sessions[name] && Srs.restore(sessions[name]);
    state = prev && !Srs.isStale(prev, now())
      ? Srs.merge(prev, subset, progress, now())
      : Srs.buildSession(subset, progress, now(), Math.random, practice);
    keepGoing();
  }

  // Стоп-экрана нет: как только слова по расписанию на сегодня кончились, сразу идет
  // тренировка - сначала самые трудные слова, круг за кругом. avoid - только что
  // отвеченное слово, чтобы оно не пошло второй раз подряд.
  function keepGoing(avoid = null) {
    if (!Srs.isFinished(state)) return;
    const subset = Lists.cardsFor(cards, listName);
    if (subset.length) state = Srs.buildSession(subset, progress, now(), Math.random, true, avoid);
  }
  openList(listName);

  function persist() {
    sessions[listName] = Srs.serialize(state);
    store.set(SESSIONS_KEY, JSON.stringify({ current: preferred, sessions }));
    store.set(PROGRESS_KEY, JSON.stringify(progress));
  }

  // --- отрисовка ---
  function setStatus(text) { $('status').textContent = text; }

  // Перенос строки только по пробелам, никогда посреди слова или транскрипции
  // (браузер иначе рвет, например, /ˌʌndəˈstænd/ на знаке ударения).
  function setParts(el, text) {
    el.textContent = '';
    String(text || '').split(' ').forEach((tok, i) => {
      if (i) el.append(' ');
      const s = document.createElement('span');
      s.className = 'seg';
      s.textContent = tok;
      el.append(s);
    });
  }

  // Если отдельное слово все равно шире карточки - уменьшаем шрифт, пока не влезет.
  function fit(el, maxRem, minRem) {
    el.style.fontSize = '';
    if (!el.clientWidth) return; // нет раскладки (тесты без браузера)
    let size = maxRem;
    while (el.scrollWidth > el.clientWidth + 1 && size > minRem) {
      size = Math.round((size - 0.1) * 10) / 10;
      el.style.fontSize = size + 'rem';
    }
  }

  function render() {
    $('listName').textContent = Lists.label(listName);
    const total = state.total;
    const finished = Srs.isFinished(state);
    $('counter').textContent = (finished ? total : Math.min(state.done + 1, total)) + ' / ' + total;
    $('fill').style.width = (total ? state.done / total * 100 : 0) + '%';
    $('prev').disabled = !history.length;
    $('next').disabled = finished;

    const ipaBtn = $('ipaBtn'), ipaBox = $('ipaBox'), hint = $('hint');
    // Метка режима: план на сегодня выполнен, дальше тренировка трудных слов.
    $('mode').textContent = state.practice ? '✓ План на сегодня выполнен · тренировка' : '';

    if (finished) { // сюда попадаем только с пустым списком
      $('face').dataset.side = 'done';
      $('word').style.fontSize = '';
      $('word').textContent = 'Пусто';
      hint.textContent = 'В этом списке нет слов.';
      hint.hidden = false;
      ipaBtn.hidden = ipaBox.hidden = true;
      $('other').hidden = Lists.menuItems(cards).length < 2;
      return;
    }

    $('other').hidden = true;
    hint.hidden = true;
    const card = byKey.get(Srs.current(state));
    if (!state.flipped) {
      $('face').dataset.side = 'ru';
      setParts($('word'), card.ru);
      fit($('word'), 2, 1.1);
      ipaBtn.hidden = ipaBox.hidden = true;
    } else {
      $('face').dataset.side = 'en';
      setParts($('word'), card.en);
      fit($('word'), 2, 1.1);
      const has = Srs.hasIpa(card);
      // по нажатию кнопка исчезает, на ее месте появляется транскрипция
      ipaBtn.hidden = !has || state.ipaShown;
      ipaBtn.setAttribute('aria-expanded', String(state.ipaShown));
      ipaBox.hidden = !(has && state.ipaShown);
      setParts($('ipa'), card.ipa);
      setParts($('read'), card.read);
      if (!ipaBox.hidden) { fit($('ipa'), 1.15, 0.8); fit($('read'), 1.2, 0.8); }
    }
  }

  function update(next) { state = next; persist(); render(); }

  // Смахивание: "помню", если карточку не переворачивали, иначе "не помню".
  // Перед каждым ответом запоминаем, как было, чтобы его можно было отменить.
  function answer() {
    if (Srs.isFinished(state)) return;
    const key = Srs.current(state);
    history.push({ state, key, had: key in progress, rec: progress[key] });
    if (history.length > UNDO_MAX) history.shift();
    const r = Srs.swipe(state, progress, now());
    progress = r.progress;
    state = r.s;
    keepGoing(key);
    update(state);
  }

  // Вернуть предыдущую карточку: занятие и запись прогресса этого слова - как до смахивания.
  // Карточка возвращается русской стороной; если ответ уже видели, это остается "не помню".
  function undo() {
    const h = history.pop();
    if (!h) return false;
    progress = { ...progress };
    if (h.had) progress[h.key] = h.rec; else delete progress[h.key];
    const back = { ...h.state, flipped: false, ipaShown: false };
    update(Srs.merge(back, Lists.cardsFor(cards, listName), progress)); // слова могли обновиться
    return true;
  }

  // --- выбор списка ---
  // В меню: сколько слов списка еще ждут сегодня ("✓" - план выполнен).
  function todayOf(name) {
    const n = Srs.remainingToday(Lists.cardsFor(cards, name), progress, now());
    return n ? 'еще ' + n : '✓';
  }

  function showPicker() {
    const box = $('pickerList');
    box.textContent = '';
    for (const name of Lists.menuItems(cards)) {

      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pick' + (name === listName ? ' current' : '');
      b.dataset.list = name;
      const t = document.createElement('span'); t.textContent = Lists.label(name);
      const n = document.createElement('span'); n.className = 'cnt'; n.textContent = todayOf(name);
      b.append(t, n);
      b.addEventListener('click', () => { hidePicker(); persist(); preferred = name; openList(name); persist(); render(); });
      box.append(b);
    }
    $('picker').hidden = false;
    $('listBtn').setAttribute('aria-expanded', 'true');
    const cur = box.querySelector('.current');
    if (cur) cur.focus();
  }
  function hidePicker() {
    $('picker').hidden = true;
    $('listBtn').setAttribute('aria-expanded', 'false');
  }

  $('listBtn').addEventListener('click', () => ($('picker').hidden ? showPicker() : hidePicker()));
  $('picker').addEventListener('click', (e) => { if (e.target === $('picker')) hidePicker(); });
  // Клавиатура (компьютер) - как стрелки на экране: стрелка вправо - следующая карточка,
  // стрелка влево - вернуть предыдущую, пробел - перевернуть, Esc - закрыть меню списков.
  document.addEventListener('keydown', (e) => {
    if (!$('picker').hidden) { if (e.key === 'Escape') hidePicker(); return; }
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    if (e.key === ' ' || e.key === 'Spacebar') {
      if (e.target.closest && e.target.closest('button')) return; // пробел на кнопке - нажать кнопку
      e.preventDefault(); update(Srs.flip(state));
    } else if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
  });

  // --- карточка ---
  // Переворот - тап в любое место экрана, кроме кнопок (транскрипция, выбор списка,
  // "Повторить еще раз") и открытого меню списков.
  // Тап пальцем обрабатываем сами на pointerup: Chrome на телефоне иногда не присылает click
  // для тапа, сделанного сразу после смахивания. click остается для мыши/клавиатуры,
  // а click, пришедший вслед за уже обработанным тапом или жестом, игнорируется.
  let suppressClick = false;
  const flippable = (target) => $('picker').hidden && !target.closest('button, #picker');
  document.addEventListener('click', (e) => {
    if (suppressClick) { suppressClick = false; return; }
    if (flippable(e.target)) update(Srs.flip(state));
  });

  // Смахивание влево - следующая карточка (оценку ставит answer()),
  // вправо - вернуть предыдущую (undo()). Срабатывает от 1/5 ширины карточки.
  const cardEl = document.querySelector('.card');
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let sx = null, sy = 0, dragging = false;
  const threshold = () => Math.max(50, (cardEl.clientWidth || 300) / 5);

  // Анимации: текущая карточка улетает в сторону dir (-1 влево, +1 вправо),
  // новая въезжает с противоположной стороны.
  let sliding = false; // пока карточка улетает, второе нажатие не засчитывается
  function slide(dir, action) {
    if (sliding) return;
    if (reduceMotion) { cardEl.style.transform = ''; action(); return; }
    sliding = true;
    cardEl.classList.remove('dragging');
    cardEl.style.transform = 'translateX(' + dir * 120 + '%) rotate(' + dir * 8 + 'deg)';
    setTimeout(() => {
      sliding = false;
      action();
      cardEl.classList.add('dragging'); // без анимации ставим новую карточку с другой стороны
      cardEl.style.transform = 'translateX(' + -dir * 40 + 'px)';
      void cardEl.offsetWidth;
      cardEl.classList.remove('dragging');
      cardEl.style.transform = '';
    }, 180);
  }
  const goNext = () => { if (!Srs.isFinished(state)) slide(-1, answer); };
  const goBack = () => { if (history.length) slide(1, undo); };
  $('next').addEventListener('click', goNext);
  $('prev').addEventListener('click', goBack);

  function resetDrag() {
    sx = null; dragging = false;
    cardEl.classList.remove('dragging');
    cardEl.style.transform = '';
  }
  let tapStart = null; // для распознавания тапа: где и когда коснулись
  document.addEventListener('pointerdown', (e) => {
    suppressClick = false; // новое касание - лишний click от прошлого жеста уже не придет
    tapStart = null;
    if (e.isPrimary === false || e.button > 0) return;
    if (!flippable(e.target)) return;
    tapStart = { x: e.clientX, y: e.clientY, t: Date.now() };
    sx = e.clientX; sy = e.clientY; dragging = false; // на экране "на сегодня все" - только вправо, назад
  });
  document.addEventListener('pointermove', (e) => {
    if (sx === null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!dragging && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      dragging = true;
      cardEl.classList.add('dragging');
    }
    if (dragging) {
      // куда можно уйти - идет за пальцем, куда нельзя - только легкая "резинка"
      const canLeft = !Srs.isFinished(state), canRight = history.length > 0;
      const x = (dx < 0 ? (canLeft ? 1 : 0.15) : (canRight ? 1 : 0.15)) * dx;
      cardEl.style.transform = 'translateX(' + x + 'px) rotate(' + x / 40 + 'deg)';
    }
  });
  document.addEventListener('pointerup', (e) => {
    const tap = tapStart;
    tapStart = null;
    const isTap = tap && !dragging && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) < 12 && Date.now() - tap.t < 700;
    if (isTap && e.pointerType && e.pointerType !== 'mouse') {
      suppressClick = true; // click, если придет, - тот же самый тап
      setTimeout(() => { suppressClick = false; }, 700);
      update(Srs.flip(state));
    }
    if (sx === null) return;
    const dx = e.clientX - sx;
    const wasDrag = dragging;
    sx = null; dragging = false;
    cardEl.classList.remove('dragging');
    if (!wasDrag) { cardEl.style.transform = ''; return; }
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 400);
    if (dx <= -threshold() && !Srs.isFinished(state)) slide(-1, answer);
    else if (dx >= threshold() && history.length) slide(1, undo);
    else cardEl.style.transform = ''; // не дотянули или некуда - назад на место
  });
  document.addEventListener('pointercancel', () => { tapStart = null; resetDrag(); });

  $('face').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); update(Srs.flip(state)); }
  });
  $('ipaBtn').addEventListener('click', () => update(Srs.toggleIpa(state)));
  // На экране "на сегодня все": пройти список еще раз. Расписание раньше срока не сдвигается,
  // а забытые слова снова попадают на доучивание.
  $('other').addEventListener('click', () => showPicker());

  persist();
  render();

  // Подтягиваем свежие слова из таблицы; без сети остаются сохраненные.
  async function refresh() {
    try {
      const fresh = await Sheet.fetchCards(window.fetch.bind(window));
      store.set(WORDS_KEY, JSON.stringify(fresh));
      setCards(fresh);
      const items = Lists.menuItems(cards);
      if (listName !== preferred && items.includes(preferred)) {
        persist();
        openList(preferred); // выбранный список появился после загрузки таблицы
      } else if (items.includes(listName)) {
        const subset = Lists.cardsFor(cards, listName);
        if (state.practice && Srs.hasNew(subset, progress)) {
          // в таблицу добавили слова - из тренировки возвращаемся к плану на сегодня
          state = Srs.buildSession(subset, progress, now());
        } else {
          state = Srs.merge(state, subset, progress, now());
        }
        keepGoing();
      } else {
        openList(Lists.ALL); // выбранный список исчез из таблицы
      }
      persist();
      render();
      if (!$('picker').hidden) showPicker();
      setStatus(''); // все в порядке - внизу ничего не пишем
    } catch (e) {
      // Без интернета это нормально - молчим. Сообщаем, только если интернет есть,
      // а таблица не отдалась (например, закрыли доступ).
      setStatus(navigator.onLine === false ? '' : 'Не удалось обновить слова из таблицы');
    }
  }

  // Наступил новый день - собираем новое занятие: подошли сроки повторений.
  function rollDay() {
    if (Srs.isStale(state, now())) { openList(listName); persist(); render(); }
  }

  // Установленное приложение Android не перезагружает страницу, когда его снова
  // открывают из фона, поэтому слова подтягиваем и при каждом возвращении в приложение
  // (не чаще раза в 20 секунд, чтобы не дергать таблицу при быстрых переключениях).
  const MIN_GAP = 20000;
  let lastRefresh = 0;
  function refreshIfStale() {
    if (Date.now() - lastRefresh < MIN_GAP) return lastRefresh && window.flashcardsReady;
    lastRefresh = Date.now();
    window.flashcardsReady = refresh();
    return window.flashcardsReady;
  }
  refreshIfStale();
  window.addEventListener('online', () => { lastRefresh = 0; refreshIfStale(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { rollDay(); refreshIfStale(); }
  });
  window.addEventListener('pageshow', (e) => { if (e.persisted) { rollDay(); refreshIfStale(); } });

  if ('serviceWorker' in navigator && window.isSecureContext && /^https?:/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();

</script>
</body>
